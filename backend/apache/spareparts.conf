# Serve built frontend from default DocumentRoot: /usr/local/apache2/htdocs
<Directory "/usr/local/apache2/htdocs">
  AllowOverride All
  Require all granted
  DirectoryIndex index.html
  FallbackResource /index.html
</Directory>

# Proxy API traffic to Node service
ProxyPass /api http://node_api:3000/api
ProxyPassReverse /api http://node_api:3000/api
